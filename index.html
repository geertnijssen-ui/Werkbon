:root{
  --acc:#f68f1e; --acc-dark:#d4770f; --acc-tekst:#2b2115;
  --grijs:#91969d; --grijs-donker:#6f747b;
  --bg:#eef0f2; --paneel:#ffffff; --tekst:#23262a; --zacht:#6f747b; --lijn:#c9ced4;
  --groen:#2f7d4f; --rood:#b3261e; --radius:10px;

@media (prefers-color-scheme: dark){

    --bg:#15181b; --paneel:#1f2326; --tekst:#eceef0; --zacht:#a0a6ad; --lijn:#343a40;

}

<script>
window.__toonFout = function(m){
  var d = document.getElementById("fout");
  if(!d) return;
  d.style.display = "block";
  d.textContent = "Er ging iets mis bij het starten:\n\n" + m;
};
window.onerror = function(msg, src, lijn, kol){ window.__toonFout(msg + "  (regel " + lijn + ":" + kol + ")"); };
function laad(urls, klaar){
  var i = 0;
  (function volgende(){
    if(i >= urls.length){ window.__toonFout("Kon niet laden: " + urls[0]); return; }
    var s = document.createElement("script");
    s.crossOrigin = "anonymous";
    s.src = urls[i++];
    s.onload = klaar;
    s.onerror = volgende;
    document.head.appendChild(s);
  })();
}
</script>

/* ---------- rekenwerk ---------- */
function minutenVan(t) {
    if (!t || t.indexOf(":") < 0)
        return null;
    const p = t.split(":");
    const h = parseInt(p[0], 10), m = parseInt(p[1], 10);
    if (isNaN(h) || isNaN(m))
        return null;
    return h * 60 + m;
}
function dagMinuten(d) {
    const b = minutenVan(d.begin), e = minutenVan(d.einde);
    if (b === null || e === null)
        return 0;
    let v = e - b;
    if (v < 0)
        v += 24 * 60;
    v -= (parseInt(d.pauze, 10) || 0);
    return v > 0 ? v : 0;
}
function hhmm(min) {
    const h = Math.floor(min / 60), m = min % 60;
    return h + ":" + (m < 10 ? "0" + m : m);
}
function totalen(dagen) {
    let min = 0, vb = 0, km = 0;
    (dagen || []).forEach(d => {
        min += dagMinuten(d);
        vb += parseFloat(String(d.supplUren || "").replace(",", ".")) || 0;
        km += parseFloat(String(d.supplKm || "").replace(",", ".")) || 0;
    });
    return { min: min, vb: vb, km: km };
}
function dagNaam(datum, taal) {
    if (!datum)
        return "";
    const d = new Date(datum + "T00:00:00");
    if (isNaN(d.getTime()))
        return "";
    return LBL[taal].dagen[d.getDay()];
}
function datumNL(datum) {
    if (!datum)
        return "";
    const p = datum.split("-");
    return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : datum;
}
function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function nl2br(s) { return esc(s).replace(/\n/g, "<br>"); }

/* verdeling over pagina's: vaste schatting, geen DOM-meting */
function verdeel(b) {
    const tekst = b.beschrijving || "";
    const fotos = b.fotos || [];
    const dagen = b.dagen || [];
    const maxDagen1 = tekst.length > 900 ? 5 : (tekst.length > 500 ? 7 : 9);
    const dagen1 = dagen.slice(0, maxDagen1);
    const dagenRest = dagen.slice(maxDagen1);
    const fotosOpP1 = fotos.length > 0 && tekst.length <= 700;
    const maxChars = fotosOpP1 ? 700 : 1300;
    let deel1 = tekst, deel2 = "";
    if (tekst.length > maxChars) {
        let snij = tekst.lastIndexOf(" ", maxChars);
        if (snij < maxChars * 0.6)
            snij = maxChars;
        deel1 = tekst.slice(0, snij);
        deel2 = tekst.slice(snij).replace(/^\s+/, "");
    }
    return {
        deel1: deel1, deel2: deel2,
        fotos1: fotosOpP1 ? fotos : [],
        fotos2: fotosOpP1 ? [] : fotos,
        dagen1: dagen1, dagenRest: dagenRest,
        extra: !!(deel2 || (!fotosOpP1 && fotos.length) || dagenRest.length)
    };
}
function descFont(len) {

/* ---------- externe libs ---------- */
function laadScript(src) {
    return new Promise((res, rej) => {
        if (document.querySelector('script[src="' + src + '"]'))
            return res();
        const s = document.createElement("script");
        s.src = src;
        s.onload = res;
        s.onerror = () => rej(new Error("laden mislukt"));
        document.head.appendChild(s);
    });
}
async function laadPdfLibs() {
    await laadScript("libs/html2canvas.min.js");
    await laadScript("libs/jspdf.umd.min.js");
}
async function maakPdfBlob(bon, settings) {
    await laadPdfLibs();
    const houder = document.createElement("div");
    houder.style.cssText = "position:fixed;left:-10000px;top:0;width:794px;background:#fff";
    houder.innerHTML = buildPdfHtml(bon, settings);
    document.body.appendChild(houder);
    try {
        const jsPDF = window.jspdf.jsPDF;
        const doc = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
        const paginas = houder.querySelectorAll(".page");
        for (let i = 0; i < paginas.length; i++) {
            const canvas = await window.html2canvas(paginas[i], { scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false });
            const img = canvas.toDataURL("image/jpeg", 0.8);
            if (i > 0)
                doc.addPage();
            doc.addImage(img, "JPEG", 7, 7, 196, 283);
        }
        return doc.output("blob");
    }
    finally {
        document.body.removeChild(houder);
    }
}

/* ---------- foto's ---------- */
function verkleinFoto(file, max) {
    return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => {
            const img = new Image();
            img.onload = () => {
                let w = img.width, h = img.height;
                if (w > max || h > max) {
                    const f = max / Math.max(w, h);
                    w = Math.round(w * f);
                    h = Math.round(h * f);
                }
                const c = document.createElement("canvas");
                c.width = w;
                c.height = h;
                c.getContext("2d").drawImage(img, 0, 0, w, h);
                res(c.toDataURL("image/jpeg", 0.7));
            };
            img.onerror = rej;
            img.src = r.result;
        };
        r.onerror = rej;
        r.readAsDataURL(file);
    });
}
/* ---------- logo ---------- */
function logoNaarPng(file) {
    return new Promise((res, rej) => {
        const teken = (bron) => {
            const img = new Image();
            img.onload = () => {
                const max = 640;
                const bw = img.width || 640, bh = img.height || 384;
                const f = Math.min(max / bw, max / bh, 6);
                const c = document.createElement("canvas");
                c.width = Math.max(1, Math.round(bw * f));
                c.height = Math.max(1, Math.round(bh * f));
                const ctx = c.getContext("2d");
                ctx.fillStyle = "#fff";
                ctx.fillRect(0, 0, c.width, c.height);
                ctx.drawImage(img, 0, 0, c.width, c.height);
                res(c.toDataURL("image/png"));
            };
            img.onerror = () => rej(new Error("logo"));
            img.src = bron;
        };
        const r = new FileReader();
        r.onerror = rej;
        if (file.type === "image/svg+xml") {
            r.onload = () => {
                let tekst = String(r.result);
                if (tekst.indexOf("width=") < 0) {
                    let bw = 640, bh = 384;
                    const vb = tekst.match(/viewBox="([-\d.\s]+)"/);
                    if (vb) {
                        const d = vb[1].trim().split(/\s+/).map(Number);
                        if (d.length === 4 && d[2] && d[3]) {
                            bw = d[2] * 4;
                            bh = d[3] * 4;
                        }
                    }
                    tekst = tekst.replace("<svg", '<svg width="' + Math.round(bw) + '" height="' + Math.round(bh) + '"');
                }
                teken("data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(tekst))));
            };
            r.readAsText(file);
        }
        else {
            r.onload = () => teken(r.result);
            r.readAsDataURL(file);
        }
    });
}
/* ---------- handtekening ---------- */
function Handtekening(props) {
    const { waarde, onOk, hoogte, T } = props;
    const canvasRef = useRef(null);
    const [vast, setVast] = useState(!!waarde);
    const [leeg, setLeeg] = useState(!waarde);
    const bezig = useRef(false);
    useEffect(() => {
        const c = canvasRef.current;
        if (!c)
            return;
        const rect = c.getBoundingClientRect();
        c.width = Math.max(300, Math.round(rect.width));
        c.height = hoogte;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#111";
        if (waarde) {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, c.width, c.height);
            img.src = waarde;
        }
    }, [hoogte, waarde]);
    useEffect(() => {
        const c = canvasRef.current;
        if (!c)
            return;
        const punt = (ev) => {
            const r = c.getBoundingClientRect();
            const t = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
            return { x: (t.clientX - r.left) * (c.width / r.width), y: (t.clientY - r.top) * (c.height / r.height) };
        };
        const start = (ev) => {
            if (vast)
                return;
            ev.preventDefault();
            bezig.current = true;
            const ctx = c.getContext("2d");
            const p = punt(ev);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
        };
        const beweeg = (ev) => {
            if (!bezig.current || vast)
                return;
            ev.preventDefault();
            const ctx = c.getContext("2d");
            const p = punt(ev);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            if (leeg)
                setLeeg(false);
        };
        const stop = () => { bezig.current = false; };
        c.addEventListener("touchstart", start, { passive: false });
        c.addEventListener("touchmove", beweeg, { passive: false });
        c.addEventListener("touchend", stop, { passive: false });
        c.addEventListener("mousedown", start);
        c.addEventListener("mousemove", beweeg);
        window.addEventListener("mouseup", stop);
        return () => {
            c.removeEventListener("touchstart", start);
            c.removeEventListener("touchmove", beweeg);
            c.removeEventListener("touchend", stop);
            c.removeEventListener("mousedown", start);
            c.removeEventListener("mousemove", beweeg);
            window.removeEventListener("mouseup", stop);
        };
    }, [vast, leeg]);
    const wis = () => {
        const c = canvasRef.current;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#111";
        setVast(false);
        setLeeg(true);
        onOk("");
    };
    const ok = () => {
        if (leeg)
            return;
        setVast(true);
        onOk(canvasRef.current.toDataURL("image/png"));
    };
    return (React.createElement("div", null,
        React.createElement("canvas", { ref: canvasRef, className: "sigCanvas" + (vast ? " vast" : ""), style: { height: hoogte + "px" } }),
        React.createElement("div", { className: "sigBtns" },
            React.createElement("button", { className: "btn klein", onClick: wis }, T.wissen),
            vast ? React.createElement("span", { className: "vastTag" },
                "\u2713 ",
                T.vast)
                : React.createElement("button", { className: "btn klein groen", onClick: ok, disabled: leeg }, "\u2713 OK"))));
}
/* ---------- tekenen over het volledige scherm ---------- */

            return { x: t.clientX - r.left, y: t.clientY - r.top };

        const start = (ev) => { ev.preventDefault(); bezig.current = true; const ctx = c.getContext("2d"); const p = punt(ev); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
        const beweeg = (ev) => { if (!bezig.current)

            c.removeEventListener("touchmove", beweeg);
            c.removeEventListener("touchend", stop);

/* ---------- opslag: IndexedDB met cache in het geheugen ---------- */
window.WBStore = {
  cache: {}, db: null, opFout: null,
  init: function(){
    var self = this;
    return new Promise(function(klaar){
      if(!window.indexedDB){ self.vanLocalStorage(); return klaar(); }
      var req = indexedDB.open("werkbon", 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore("kv"); };
      req.onerror = function(){ self.vanLocalStorage(); klaar(); };
      req.onsuccess = function(){
        self.db = req.result;
        var tx = self.db.transaction("kv", "readonly"), st = tx.objectStore("kv");
        var kr = st.getAllKeys(), vr = st.getAll();
        tx.oncomplete = function(){
          kr.result.forEach(function(k, i){ self.cache[k] = vr.result[i]; });
          if(!kr.result.length){
            /* eerste start na de update: gegevens uit localStorage overnemen */
            self.vanLocalStorage();
            Object.keys(self.cache).forEach(function(k){ self.zet(k, self.cache[k]); });
          }
          klaar();
        };
        tx.onerror = function(){ self.vanLocalStorage(); klaar(); };
      };
    }).then(function(){
      if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
    });
  },
  vanLocalStorage: function(){
    try {
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(k.indexOf("wb_") === 0){ try { this.cache[k] = JSON.parse(localStorage.getItem(k)); } catch(e){} }
      }
    } catch(e){}
  },
  fout: function(){ if(this.opFout) this.opFout(); },
  zet: function(k, v){
    this.cache[k] = v;
    var self = this;
    if(!this.db){
      try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ self.fout(); }
      return;
    }
    try {
      var tx = this.db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(v, k);
      tx.onerror = tx.onabort = function(){ self.fout(); };
    } catch(e){ self.fout(); }
  },
  wis: function(k){
    delete this.cache[k];
    try { if(this.db) this.db.transaction("kv", "readwrite").objectStore("kv").delete(k); else localStorage.removeItem(k); } catch(e){}
  }
};
/* knop Update: vraagt Netlify of er een nieuwe sw.js is; zo ja installeert die zich en herlaadt de app */
var herladen = false;
window.zoekUpdate = function(){
  if(!navigator.onLine) return Promise.resolve("offline");
  if(!("serviceWorker" in navigator)){ setTimeout(function(){ location.reload(); }, 800); return Promise.resolve("nieuw"); }
  return navigator.serviceWorker.getRegistration().then(function(reg){
    if(!reg){ setTimeout(function(){ location.reload(); }, 800); return "nieuw"; }
    return reg.update().then(function(){
      if(!reg.installing && !reg.waiting) return "laatste";
      herladen = true;
      /* vangnet als controllerchange uitblijft */
      setTimeout(function(){ location.reload(); }, 10000);
      return "nieuw";
    });
  }).catch(function(){ return "fout"; });
};
if("serviceWorker" in navigator){
  /* nieuwe versie op Netlify: de service worker wordt vervangen en de app herlaadt eenmaal */
  herladen = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function(){ if(herladen){ herladen = false; location.reload(); } });
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function(reg){
      /* iPhone: app komt vaak uit de achtergrond terug zonder herstart, dus dan ook controleren */
      document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") reg.update().catch(function(){}); });
    }).catch(function(){});
  });
}
