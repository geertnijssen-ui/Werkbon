<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Werkbon MT Service</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#24282c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Werkbon">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="root"></div>
<div id="fout" style="display:none;padding:16px;font:14px monospace;color:#b3261e;background:#fff;white-space:pre-wrap"></div>
<script>
window.__toonFout = function(m){
  var d = document.getElementById("fout");
  if(!d) return;
  d.style.display = "block";
  d.textContent = "Er ging iets mis bij het starten:\n\n" + m;
};
window.onerror = function(msg, src, lijn, kol){ window.__toonFout(msg + "  (regel " + lijn + ":" + kol + ")"); };
function laad(urls, klaar){
  var i = 0;
  (function volgende(){
    if(i >= urls.length){ window.__toonFout("Kon niet laden: " + urls[0]); return; }
    var s = document.createElement("script");
    s.crossOrigin = "anonymous";
    s.src = urls[i++];
    s.onload = klaar;
    s.onerror = volgende;
    document.head.appendChild(s);
  })();
}
</script>
<script src="js/opslag.js"></script>
<script>
laad(["libs/react.production.min.js"], function(){
  laad(["libs/react-dom.production.min.js"], function(){
    /* uren-module en app, in deze volgorde */
    var reeks = ["js/uren-calc.js", "js/uren-pdf.js", "js/uren.js", "js/basis.js", "js/talen.js", "js/bon-pdf.js", "js/onderdelen.js", "js/app.js"];
    (function volgende(i){
      if(i >= reeks.length){
        WBStore.init().then(function(){
          try { window.startApp(); } catch(e){ window.__toonFout(e && e.message ? e.message : String(e)); }
        });
        return;
      }
      laad([reeks[i]], function(){ volgende(i + 1); });
    })(0);
  });
});
</script>
</body>
</html>
